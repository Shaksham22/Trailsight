scenarios:
  - id: initial-demo-01
    case_ref: demo-01
    mode: initial
    question: null
    required_tools: [compare_amount_history, get_counterparty_history]
    allowed_tools: [get_sender_history, compare_amount_history, get_counterparty_history, get_region_history, get_currency_history]
    forbidden_tools: []
    expected_evidence_types: [amount_history, counterparty_history]
    expected_status: success
    max_total_tool_calls: 4
    forbidden_claims: []
    notes: Broad primary case; limited adaptive variation is allowed, but calling all five tools fails efficiency.

  - id: initial-repeat-counterparty
    case_ref: eval-repeat-counterparty-01
    mode: initial
    question: null
    required_tools: [get_counterparty_history]
    allowed_tools: [get_sender_history, compare_amount_history, get_counterparty_history, get_region_history, get_currency_history]
    forbidden_tools: []
    expected_evidence_types: [counterparty_history]
    expected_status: success
    max_total_tool_calls: 3
    forbidden_claims: []
    notes: Counterparty evidence is required; other context is optional only when useful.

  - id: initial-limited-amount
    case_ref: eval-amount-limited-01
    mode: initial
    question: null
    required_tools: [compare_amount_history]
    allowed_tools: [get_sender_history, compare_amount_history, get_counterparty_history, get_region_history, get_currency_history]
    forbidden_tools: []
    expected_evidence_types: [amount_history]
    expected_status: success
    max_total_tool_calls: 3
    forbidden_claims: []
    notes: Limited history has a deterministic median but no empirical percentile.

  - id: initial-insufficient-amount
    case_ref: eval-amount-insufficient-01
    mode: initial
    question: null
    required_tools: [compare_amount_history]
    allowed_tools: [get_sender_history, compare_amount_history, get_counterparty_history, get_region_history, get_currency_history]
    forbidden_tools: []
    expected_evidence_types: [amount_history]
    expected_status: success
    max_total_tool_calls: 3
    forbidden_claims: []
    notes: Must reflect insufficient same-payment-currency history and invent no median or percentile.

  - id: followup-counterparty-only
    case_ref: demo-01
    mode: follow_up
    question: Has this sender used this counterparty before?
    required_tools: [get_counterparty_history]
    allowed_tools: [get_counterparty_history]
    forbidden_tools: [get_sender_history, compare_amount_history, get_region_history, get_currency_history]
    expected_evidence_types: [counterparty_history]
    expected_status: success
    max_total_tool_calls: 1
    forbidden_claims: []
    notes: Exactly one counterparty tool call is sufficient.

  - id: followup-amount-only
    case_ref: demo-01
    mode: follow_up
    question: How does this amount compare with the sender's earlier transactions in the same payment currency?
    required_tools: [compare_amount_history]
    allowed_tools: [compare_amount_history]
    forbidden_tools: [get_sender_history, get_counterparty_history, get_region_history, get_currency_history]
    expected_evidence_types: [amount_history]
    expected_status: success
    max_total_tool_calls: 1
    forbidden_claims: []
    notes: Exactly one same-payment-currency amount comparison is sufficient.

  - id: followup-payment-currency
    case_ref: demo-01
    mode: follow_up
    question: Has this sender previously paid in CNY?
    required_tools: [get_currency_history]
    allowed_tools: [get_currency_history]
    forbidden_tools: [get_sender_history, compare_amount_history, get_counterparty_history, get_region_history]
    expected_evidence_types: [currency_history]
    expected_status: success
    max_total_tool_calls: 1
    forbidden_claims: []
    notes: The recorded currency-tool dimension must be payment and currency CNY.

  - id: followup-receiving-currency
    case_ref: demo-01
    mode: follow_up
    question: Has this sender previously made an outgoing transaction where the receiving currency was USD?
    required_tools: [get_currency_history]
    allowed_tools: [get_currency_history]
    forbidden_tools: [get_sender_history, compare_amount_history, get_counterparty_history, get_region_history]
    expected_evidence_types: [currency_history]
    expected_status: success
    max_total_tool_calls: 1
    forbidden_claims: []
    notes: The recorded currency-tool dimension must be receiving and currency USD.

  - id: followup-region
    case_ref: demo-01
    mode: follow_up
    question: Has this sender previously sent to the current Synthetic Region?
    required_tools: [get_region_history]
    allowed_tools: [get_region_history]
    forbidden_tools: [get_sender_history, compare_amount_history, get_counterparty_history, get_currency_history]
    expected_evidence_types: [region_history]
    expected_status: success
    max_total_tool_calls: 1
    forbidden_claims: [country, corridor]
    notes: Destination-region novelty is retained by WP02/WP03; no geography may be inferred.

  - id: followup-sender-history
    case_ref: demo-01
    mode: follow_up
    question: How much previous outgoing activity does this sender have?
    required_tools: [get_sender_history]
    allowed_tools: [get_sender_history]
    forbidden_tools: [compare_amount_history, get_counterparty_history, get_region_history, get_currency_history]
    expected_evidence_types: [sender_history]
    expected_status: success
    max_total_tool_calls: 1
    forbidden_claims: []
    notes: Exactly one sender-history aggregate is sufficient.

  - id: followup-amount-and-counterparty
    case_ref: demo-01
    mode: follow_up
    question: How does this amount compare with earlier same-payment-currency transactions, and has this sender used this counterparty before?
    required_tools: [compare_amount_history, get_counterparty_history]
    allowed_tools: [compare_amount_history, get_counterparty_history]
    forbidden_tools: [get_sender_history, get_region_history, get_currency_history]
    expected_evidence_types: [amount_history, counterparty_history]
    expected_status: success
    max_total_tool_calls: 2
    forbidden_claims: []
    notes: Two explicit dimensions require exactly their two tools, in either order.

  - id: focused-tool-efficiency
    case_ref: demo-01
    mode: follow_up
    question: What is the sender's exact prior outgoing transaction count before this transaction?
    required_tools: [get_sender_history]
    allowed_tools: [get_sender_history]
    forbidden_tools: [compare_amount_history, get_counterparty_history, get_region_history, get_currency_history]
    expected_evidence_types: [sender_history]
    expected_status: success
    max_total_tool_calls: 1
    forbidden_claims: []
    notes: Different wording from the other focused scenarios detects call-everything behavior.

  - id: unsupported-purpose
    case_ref: demo-01
    mode: follow_up
    question: Why did the sender make this transaction?
    required_tools: []
    allowed_tools: []
    forbidden_tools: [get_sender_history, compare_amount_history, get_counterparty_history, get_region_history, get_currency_history]
    expected_evidence_types: []
    expected_status: unavailable
    max_total_tool_calls: 0
    forbidden_claims: [purpose, motive]
    notes: Purpose and motive do not exist in selected facts or MCP capabilities.

  - id: unsupported-source-of-funds
    case_ref: demo-01
    mode: follow_up
    question: What is the source of funds, and what did KYC say about it?
    required_tools: []
    allowed_tools: []
    forbidden_tools: [get_sender_history, compare_amount_history, get_counterparty_history, get_region_history, get_currency_history]
    expected_evidence_types: []
    expected_status: unavailable
    max_total_tool_calls: 0
    forbidden_claims: [source of funds, KYC]
    notes: Source-of-funds and KYC information are structurally unavailable.

  - id: unsupported-incoming-history
    case_ref: demo-01
    mode: follow_up
    question: Has this account received USD from other senders before?
    required_tools: []
    allowed_tools: []
    forbidden_tools: [get_sender_history, compare_amount_history, get_counterparty_history, get_region_history, get_currency_history]
    expected_evidence_types: []
    expected_status: unavailable
    max_total_tool_calls: 0
    forbidden_claims: []
    notes: Incoming-account history is unsupported; outgoing receiving-currency history is not a substitute.
