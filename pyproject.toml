[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trailsight"
version = "0.1.0"
description = "Trailsight synthetic transaction review application"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "mcp>=1.20,<2",
    "networkx==3.5",
    "numpy==2.5.2",
    "openai-agents>=0.4,<1",
    "pydantic>=2.11,<3",
    "PyYAML>=6,<7",
    "pytest>=8.4,<10",
    "uvicorn>=0.35,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
